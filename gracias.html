<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Message sent 💖</title>
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background-color: #fdf6ef;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      color: #3d2b27;
    }

    .box {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 32px;
      border: 1.5px solid #f0d8cc;
      box-shadow: 0 12px 40px rgba(139, 90, 80, 0.1);
      max-width: 400px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: #6b4a3e;
      margin-bottom: 1rem;
    }

    p {
      color: #7a5c55;
      margin-bottom: 1.5rem;
    }

    a {
      display: inline-block;
      text-decoration: none;
      background: #f5d5c0;
      color: #6b4a3e;
      font-weight: 700;
      padding: 10px 24px;
      border-radius: 50px;
      transition: background 0.2s, transform 0.15s;
    }

    a:hover {
      background: #e8a99a;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>💌 Message sent!</h1>
    <p>Thanks for reaching out! I'll get back to you soon ✨</p>
    <a href="index.html">Back to portfolio</a>
  </div>
</body>
</html>
